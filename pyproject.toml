[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-one-step-scheduling"
version = "0.2.0"
description = "ECPA-bound StateAxis exact-plan same-turn forward authority"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-one-step-scheduling" = "stateaxis_one_step_scheduling"

[project.entry-points."stateaxis.mod_handlers"]
one_step_scheduling = "stateaxis_one_step_scheduling:one_step_scheduling"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_one_step_scheduling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
